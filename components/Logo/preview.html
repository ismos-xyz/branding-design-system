<!-- @dsCard group="Identity" height=300 subtitle="Mark, lockup, book motif" -->
<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../tokens/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Logo</title>
<style>html,body{margin:0} body{padding:24px} .row{display:flex;flex-wrap:wrap;gap:16px}.tile{display:flex;align-items:center;justify-content:center;width:180px;height:180px;border:1px solid var(--hairline);box-sizing:border-box}.paper{background:var(--paper)}.ink{background:var(--ink);border-color:var(--logwood-700)}.stack{flex-direction:column}.horiz{width:240px;gap:17px}.wm{font-family:var(--font-wordmark);font-weight:500;font-size:26px;line-height:1;letter-spacing:.04em;color:var(--ink);margin-top:10px}.horiz .wm{margin-top:0}.ad{font-family:var(--font-mono);font-weight:500;font-size:8px;letter-spacing:.4em;color:var(--logwood);margin-top:8px}</style></head>
<body class="ism-root">
<div class="row">
 <div class="tile paper"><img src="../../assets/logos/ismos-mark-ink.svg" alt="ISMOS mark" width="96" height="96"></div>
 <div class="tile ink"><img src="../../assets/logos/ismos-mark-paper.svg" alt="ISMOS mark" width="96" height="96"></div>
 <div class="tile paper stack"><img src="../../assets/logos/ismos-mark-ink.svg" alt="" width="72" height="72"><div class="wm">ISMOS</div><div class="ad">ISMOS.XYZ</div></div>
 <div class="tile paper horiz"><img src="../../assets/logos/ismos-mark-ink.svg" alt="" width="56" height="56"><div><div class="wm">ISMOS</div><div class="ad">ISMOS.XYZ</div></div></div>
 <div class="tile paper"><img src="../../assets/logos/ismos-book-ink.svg" alt="Book motif" width="56" height="56"></div>
</div>
<p class="ism-label" style="margin:16px 0 0">Ink on Paper · Paper on Ink · stacked lockup · horizontal lockup · book motif</p>
</body>
</html>
